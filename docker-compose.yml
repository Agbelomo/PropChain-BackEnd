version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://propchain:${POSTGRES_PASSWORD:-propchain}@pgbouncer:6432/propchain?pgbouncer=true
      # Required at boot by validateEnvironment(); must each be >= 32 chars.
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production-min-32c}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_WARMING_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then((r) => (r.ok ? process.exit(0) : process.exit(1))).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    networks:
      - propchain

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propchain
      POSTGRES_USER: propchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propchain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U propchain']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - propchain

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    environment:
      DATABASE_URL: postgresql://propchain:${POSTGRES_PASSWORD:-propchain}@postgres:5432/propchain
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-40}
      MAX_USER_CONNECTIONS: ${PGBOUNCER_MAX_USER_CONNECTIONS:-40}
      SERVER_IDLE_TIMEOUT: '300'
      CLIENT_IDLE_TIMEOUT: '0'
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      LOG_POOLER_ERRORS: 1
    ports:
      - '${PGBOUNCER_PORT:-6432}:6432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 6432']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - propchain

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - propchain

volumes:
  pgdata:
  redisdata:

networks:
  propchain:
    driver: bridge
